name: SABLE Stripe Revalidation Regression

on:
  push:
    branches:
      - sable/revalidate-default-guard-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-stripe-regression:
    name: Targeted regression tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.21.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted Stripe source regression tests
        run: pnpm --filter @stripe/sync-source-stripe exec vitest run src/process-event.test.ts src/resourceRegistry.test.ts src/index.test.ts

      - name: Build Stripe source package
        run: pnpm --filter @stripe/sync-source-stripe build
